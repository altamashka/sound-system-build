<svg xmlns="http://www.w3.org/2000/svg" width="760" height="579" viewBox="0 0 760 579" role="img" aria-labelledby="title desc">
  <title id="title">Three reverse-side CNC setups</title>
  <desc id="desc">The handle setup selects one body from the first 12 mm sheet. The left and right inner flares stay joined to cut the woofer recesses. The upper and lower inner flares stay joined to cut the adapter seats, retaining the reference corner. The example underneath shows two square locating stops and two asymmetric through-holes in the waste.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0l7 3.5-7 3.5z" fill="#52655a"/>
    </marker>
  </defs>
  <rect width="760" height="579" rx="16" fill="#f5f3ea"/>
  <g font-family="system-ui, sans-serif">
    <g fill="#fffdf7" stroke="#d5d8cb" stroke-width="1.5">
      <rect x="22" y="20" width="716" height="88" rx="10"/>
      <rect x="22" y="119" width="716" height="88" rx="10"/>
      <rect x="22" y="218" width="716" height="88" rx="10"/>
    </g>
    <g fill="#e2bd84" stroke="#836445" stroke-width="1.4">
      <rect x="49" y="42" width="81" height="43" rx="3"/>
      <rect x="201" y="42" width="81" height="43" rx="3"/>
      <rect x="49" y="141" width="81" height="43" rx="3"/>
      <rect x="201" y="141" width="81" height="43" rx="3"/>
      <rect x="49" y="240" width="81" height="43" rx="3"/>
      <rect x="201" y="240" width="81" height="43" rx="3"/>
    </g>
    <g fill="none" stroke="#52655a" stroke-width="2" marker-end="url(#arrow)">
      <path d="M143 70q23-27 46-4"/><path d="M143 169q23-27 46-4"/><path d="M143 268q23-27 46-4"/>
    </g>
    <g stroke="#345e4f" stroke-width="1.5" fill="#e0ebe0">
      <rect x="223" y="52" width="38" height="24" rx="4"/>
      <rect x="231" y="57" width="22" height="14" rx="3" fill="#fffdf7"/>
      <circle cx="220" cy="152" r="8"/><circle cx="263" cy="152" r="8"/><circle cx="220" cy="173" r="8"/><circle cx="263" cy="173" r="8"/>
      <path d="M229 247h24l-7 10h-10zm0 28h24l-7-10h-10z"/>
      <path d="M201 272h11v11h-11z" fill="#345e4f"/>
    </g>
    <g stroke="#836445" stroke-width="1.3" fill="none" stroke-dasharray="3 3">
      <path d="M57 162h64m-32-17v34"/>
      <path d="M57 246l64 31m-64 0 64-31"/>
    </g>
    <g fill="#28483e" font-size="19" font-weight="700">
      <text x="313" y="57">Handle recess · Sheet 1</text>
      <text x="313" y="156">Inner left/right flares · 18 mm</text>
      <text x="313" y="255">Inner upper/lower flares · 18 mm</text>
    </g>
    <g fill="#4c5c52" font-size="16">
      <text x="313" y="82">Prove the fixture on one side before repeating.</text>
      <text x="313" y="181">Flip four together to cut the woofer recesses.</text>
      <text x="313" y="280">Flip four together. Keep the reference corner.</text>

    </g>
    <rect x="22" y="317" width="716" height="242" rx="10" fill="#fffdf7" stroke="#d5d8cb" stroke-width="1.5"/>
    <text x="45" y="353" fill="#28483e" font-size="20" font-weight="700">Check the flip on scrap</text>
    <g transform="translate(61 379)">
      <rect x="0" y="0" width="205" height="142" rx="4" fill="#e0ebe0" stroke="#708376" stroke-width="1.5"/>
      <path d="M17 16v108h169" fill="none" stroke="#345e4f" stroke-width="8"/>
      <rect x="25" y="23" width="154" height="93" rx="2" fill="#e2bd84" stroke="#836445" stroke-width="1.5"/>
      <path d="M41 57h60v38H41zm76-7h46v50h-46z" fill="none" stroke="#836445" stroke-width="1.4" stroke-dasharray="4 4"/>
      <g stroke="#8e4028" stroke-width="2">
        <circle cx="52" cy="38" r="4" fill="#fffdf7"/><circle cx="144" cy="109" r="4" fill="#fffdf7"/>
      </g>
      <circle cx="25" cy="116" r="4" fill="#28483e"/>
      <text x="49" y="109" fill="#28483e" font-size="13" font-weight="700">XY</text>
    </g>
    <g fill="#28483e" font-size="17">
      <text x="298" y="395">Locate the block against two square stops.</text>
      <text x="298" y="427">Put two small through-holes in the waste.</text>
      <text x="298" y="459">After the flip, verify both holes at clearance.</text>
      <text x="298" y="511" fill="#4c5c52" font-size="15">Example layout. Use the axes and stock in each</text>
      <text x="298" y="531" fill="#4c5c52" font-size="15">Fusion setup to choose your actual locating edges.</text>
    </g>
  </g>
</svg>
